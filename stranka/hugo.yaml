baseURL: "http://localhost:1313/"
title: "Tesla katalóg"
defaultContentLanguage: sk
defaultContentLanguageInSubdir: false

module:
  imports:
    - path: github.com/imfing/hextra

languages:
  sk:
    locale: sk-SK
    label: Slovenčina
    weight: 1
  en:
    locale: en-US
    label: English
    weight: 2
    disabled: true

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: O stránke
      pageRef: /o-stranke
      weight: 3
    - name: Hľadať
      weight: 4
      params:
        type: search

params:
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true

markup:
  highlight:
    noClasses: false
