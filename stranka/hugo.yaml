# Základná adresa webu; pri nasadení nastavte verejnú URL.
baseURL: "http://localhost:1313/"
# Názov webu používaný v titulkoch a ako záložný názov značky.
title: "Tesla katalóg"
# Predvolený jazyk obsahu; false ho ponechá v koreňovej URL, nie pod /sk/.
defaultContentLanguage: sk
defaultContentLanguageInSubdir: false

# Pripojenie témy Hextra ako Hugo modulu; verzia je určená v go.mod.
module:
  imports:
    - path: github.com/imfing/hextra

# Jazyky webu: locale je jazyková lokalizácia, label zobrazovaný názov
# a weight určuje poradie. Angličtina je zatiaľ vypnutá.
languages:
  sk:
    locale: sk-SK
    label: Slovenčina
    weight: 1
  en:
    locale: en-US
    label: English
    weight: 2
    disabled: true # Aktivácia jazyka automaticky nepreloží obsah.

# Hlavná navigácia: name je text, pageRef odkaz na stránku
# a weight určuje poradie položiek od najnižšej hodnoty.
menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: O stránke
      pageRef: /o-stranke
      weight: 3
    - name: Hľadať
      weight: 4
      params:
        # Špeciálna položka vyhľadávania spracovaná témou Hextra.
        type: search

# Parametre využívané témou Hextra a vlastnými šablónami projektu.
params:
  # Texty úvodného bloku číta layouts/_shortcodes/tesla-home.html.
  home:
    badge:
      # Štítok nad nadpisom; prázdny link znamená neklikateľný štítok.
      text: "Archív československej elektroniky"
      link: ""
    # Dve časti hlavného nadpisu a úvodného textu.
    headline:
      firstLine: "Objavujte súčiastky"
      secondLine: "a dokumentáciu Tesla"
      # true vloží medzi obe časti pevné zalomenie; false ponechá prirodzené.
      breakLine: true
    subtitle:
      firstLine: "Prehľadný archív súčiastok a prístrojov"
      secondLine: "značky Tesla na jednom mieste"
    # Hlavné tlačidlo a jeho cieľová cesta.
    cta:
      text: "Prejsť do dokumentácie"
      link: "/docs"
    # Druhé tlačidlo a jeho cieľová cesta.
    secondaryCta:
      text: "Katalóg súčiastok"
      link: "/docs/katalog-suciastok/"
      showArrow: true # Šípka v druhom tlačidle.
    # Obrázok je v static/; width a height sú skutočné rozmery zdroja v px.
    image:
      path: "images/katalog-tr215.jpg"
      alt: "Sken katalógovej strany s uhlíkovými rezistormi TR 211 až TR 217"
      width: 960
      height: 1280
    # Šírky zlomov v pixeloch: stĺpce a tlačidlá sa pod nimi uložia pod seba.
    responsive:
      columnsBreakpoint: 767
      buttonsBreakpoint: 480
    # CSS hodnoty uvádzajte ako reťazce vrátane jednotiek. Odstránené položky
    # používajú pôvodné hodnoty z CSS; farby režimov sú nižšie samostatne.
    style:
      columns: "minmax(0, 1fr) minmax(0, 1fr)" # Šírky textu a obrázka.
      gap: "clamp(2rem, 5vw, 5rem)" # Medzera medzi stĺpcami.
      mobile-gap: "2rem"
      padding: "clamp(1.5rem, 4vw, 3rem) 0 3.5rem"
      headline-size: "clamp(2.35rem, 4vw, 3.5rem)"
      headline-font: "inherit" # Použite dostupný CSS font alebo zoznam fontov.
      subtitle-size: "1.2rem"
      subtitle-line-height: "1.5"
      badge-radius: "999px"
      button-radius: "999px"
      button-padding: ".75rem 1.4rem"
      button-min-height: "3rem"
      button-font-size: "1rem"
      secondary-radius: "999px"
      secondary-padding: ".75rem 1.4rem"
      secondary-min-height: "3rem"
      secondary-font-size: "1rem"
      mobile-button-width: "100%"
      image-ratio: "5 / 3"
      image-fit: "cover" # Napríklad cover alebo contain.
      image-position: "center 25%"
      image-radius: ".5rem"
      frame-width: "1px"
      frame-radius: "1rem"
      frame-padding: ".65rem"
    # Farby a tiene svetlého a tmavého režimu; transparent znamená priehľadné.
    light:
      badge-dot: "#174d92"
      badge-text: "#355477"
      badge-background: "transparent"
      badge-border: "#56789d"
      headline: "#142d50"
      subtitle: "#355477"
      button-background: "#174d92"
      button-text: "#f1f6fc"
      button-hover: "#10386c"
      secondary-background: "transparent"
      secondary-text: "#174d92"
      secondary-border: "#56789d"
      secondary-hover: "#e2edf9"
      secondary-hover-border: "#10386c"
      frame-background: "#e2edf9"
      frame-border: "#56789d"
      frame-shadow: "0 20px 50px rgba(21, 58, 133, .12)"
    dark:
      badge-dot: "#a9d0ff"
      badge-text: "#b0c9e6"
      badge-background: "transparent"
      badge-border: "#789cc4"
      headline: "#e2edfa"
      subtitle: "#b0c9e6"
      button-background: "#a9d0ff"
      button-text: "#142840"
      button-hover: "#d4e8ff"
      secondary-background: "transparent"
      secondary-text: "#a9d0ff"
      secondary-border: "#789cc4"
      secondary-hover: "#203c5c"
      secondary-hover-border: "#d4e8ff"
      frame-background: "#203c5c"
      frame-border: "#789cc4"
      frame-shadow: "0 20px 50px rgba(20, 40, 64, .25)"
  # Hlavička: logo sa načíta zo static/; rozmery sú v pixeloch.
  navbar:
    # Pozor: vlastná šablóna používa default true, preto false logo nevypne.
    displayLogo: true
    logo:
      path: images/tesla-emblem.svg
      width: 40
      height: 40
    # Text značky vedľa loga používaný vlastnou šablónou hlavičky.
    brand:
      text: "Tesla katalóg"
  # Predvolený farebný režim podľa systému a zobrazenie jeho prepínača.
  theme:
    default: system
    displayToggle: true

# Spracovanie Markdownu a zvýrazňovanie blokov kódu.
markup:
  goldmark:
    renderer:
      # Povolí HTML v Markdownu; obsah preto musí byť dôveryhodný.
      unsafe: true
  highlight:
    # false používa CSS triedy na zvýraznenie syntaxe namiesto inline štýlov.
    noClasses: false
