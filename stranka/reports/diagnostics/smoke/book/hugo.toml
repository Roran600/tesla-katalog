themesDir = "/home/roran/Documents/hugo/tesla-katalog/stranka/book/themes"
baseURL = "http://localhost:1313/"
title = "Tesla katalóg súčiastok"
theme = "book"
locale = "cs-CZ"
defaultContentLanguage = "cs"
disablePathToLower = true
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = true
timeout = "300s"

[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noClasses = false
[markup.tableOfContents]
startLevel = 2
endLevel = 3

[outputs]
home = ["HTML"]
section = ["HTML"]
page = ["HTML"]

[params]
BookSection = "docs"
BookSearch = true
BookToC = true
BookBreadcrumbs = true
BookPortableLinks = "warning"
