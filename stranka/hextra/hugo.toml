baseURL = "http://localhost:1413/"
title = "Tesla katalóg súčiastok"
theme = "hextra"
locale = "cs-CZ"
defaultContentLanguage = "cs"
disablePathToLower = true
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = true
timeout = "300s"

[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noClasses = false
[markup.tableOfContents]
startLevel = 2
endLevel = 3

[outputs]
home = ["HTML"]
section = ["HTML"]
page = ["HTML"]

[params]
description = "Archív historických elektronických súčiastok Tesla"
[params.search]
enable = true
[params.page.contextMenu]
enable = false

[[menu.main]]
name = "Katalóg"
pageRef = "/docs"
weight = 1
[[menu.main]]
name = "Vyhľadávanie"
weight = 2
[menu.main.params]
type = "search"
